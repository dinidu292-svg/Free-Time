<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>FreeTime — Watch, Share, Connect</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* ============ RESET / THEME ============ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f0f12; --surface:#181b22; --surface-2:#1f242e; --border:#2a2f3a;
    --text:#eaeef2; --muted:#8b95a5; --accent:#ff3b5c; --accent-2:#3b82f6;
    --radius:16px; --nav-h:64px;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
    min-height:100vh; display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea{font:inherit;color:inherit}
  img,video{display:block;max-width:100%}
  .hidden{display:none!important}
  .muted{color:var(--muted)}

  /* ============ TOP NAV ============ */
  .topnav{
    height:var(--nav-h); padding:0 .75rem;
    padding-top:var(--safe-t);
    display:flex; align-items:center; gap:.6rem;
    background:var(--surface); border-bottom:1px solid var(--border);
    position:sticky; top:0; z-index:50;
  }
  .brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.25rem;color:#fff;flex-shrink:0;letter-spacing:-.02em}
  .brand .logo{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,#ff3b5c,#ff7a00);
    display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff;
  }
  .brand .logo-text span{color:var(--accent)}
  .search-wrap{
    flex:1; max-width:640px; margin:0 auto;
    display:flex; align-items:center;
    background:var(--surface-2); border:1px solid var(--border);
    border-radius:40px; overflow:hidden; transition:border-color .15s;
  }
  .search-wrap:focus-within{border-color:var(--accent-2)}
  .search-wrap input{flex:1;min-width:0;padding:.6rem .9rem;background:transparent;border:none;outline:none;font-size:.95rem}
  .search-wrap button{padding:.6rem 1rem;background:var(--surface);color:var(--muted);border-left:1px solid var(--border)}
  .search-wrap button:hover{color:#fff}
  .nav-actions{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
  .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.5rem 1rem;border-radius:40px;font-weight:600;font-size:.88rem;transition:.15s ease}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover{background:#e63351}
  .btn-outline{border:1.5px solid var(--border);background:var(--surface-2)}
  .btn-outline:hover{border-color:var(--muted)}
  .btn-ghost{color:var(--muted)}
  .btn-ghost:hover{color:#fff;background:var(--surface-2)}
  .avatar{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-weight:700;color:#fff;font-size:.9rem;cursor:pointer;flex-shrink:0;overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover}

  /* ============ SHELL ============ */
  .shell{display:flex;flex:1;min-height:0}

  /* ============ SIDEBAR (desktop only) ============ */
  .sidebar{
    width:220px; flex-shrink:0; padding:1rem .75rem;
    border-right:1px solid var(--border); background:var(--surface);
    display:flex; flex-direction:column; gap:.15rem;
    position:sticky; top:var(--nav-h); height:calc(100vh - var(--nav-h));
    overflow-y:auto;
  }
  .side-item{
    display:flex;align-items:center;gap:.85rem;
    padding:.6rem .85rem;border-radius:10px;
    color:var(--muted);font-size:.9rem;font-weight:500;cursor:pointer;transition:.12s;
  }
  .side-item i{width:18px;text-align:center}
  .side-item:hover{background:var(--surface-2);color:#fff}
  .side-item.active{background:var(--surface-2);color:#fff;border-left:3px solid var(--accent)}
  .side-divider{height:1px;background:var(--border);margin:.5rem .4rem}

  .main{flex:1;min-width:0;padding:1.25rem 1.5rem 4rem;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ============ AUTH SCREEN ============ */
  .auth-screen{min-height:calc(100vh - var(--nav-h));display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem}
  .auth-card{
    width:100%;max-width:420px;background:var(--surface);
    border:1px solid var(--border);border-radius:22px;padding:1.75rem;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
  }
  .auth-tabs{display:flex;gap:.2rem;margin-bottom:1.5rem;background:var(--surface-2);padding:.3rem;border-radius:40px}
  .auth-tab{flex:1;padding:.6rem;border-radius:40px;color:var(--muted);font-weight:600;font-size:.9rem;transition:.15s}
  .auth-tab.active{background:var(--accent);color:#fff}
  .field{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.85rem}
  .field label{font-size:.8rem;color:var(--muted);font-weight:500}
  .field input,.field textarea{
    background:var(--bg);border:1px solid var(--border);border-radius:12px;
    padding:.75rem .9rem;outline:none;transition:.15s;font-size:.95rem;width:100%;
  }
  .field input:focus,.field textarea:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
  .auth-submit{width:100%;padding:.85rem;background:var(--accent);color:#fff;border-radius:40px;font-weight:700;font-size:1rem;margin-top:.5rem;transition:.15s}
  .auth-submit:hover{background:#e63351}
  .auth-msg{margin-top:.9rem;font-size:.86rem;text-align:center;min-height:1.2em}
  .auth-msg.error{color:#ff6b81}
  .auth-msg.ok{color:#4ade80}

  /* ============ PROFILE ============ */
  .profile-banner{height:110px;border-radius:18px;background:linear-gradient(120deg,#1e3a8a,#7c3aed,#db2777);position:relative;margin-bottom:-36px}
  .profile-head{display:flex;align-items:flex-end;gap:1.2rem;padding:0 1rem;position:relative;z-index:2;flex-wrap:wrap}
  .avatar-xl{
    width:100px;height:100px;border-radius:50%;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;align-items:center;justify-content:center;
    font-size:2.2rem;font-weight:800;color:#fff;
    border:5px solid var(--bg);overflow:hidden;
  }
  .avatar-xl img{width:100%;height:100%;object-fit:cover}
  .profile-meta{padding-bottom:.4rem;min-width:0}
  .profile-meta h1{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:.15rem;word-break:break-word}
  .profile-meta .username{color:var(--muted);font-size:.9rem;margin-bottom:.4rem}
  .stats{display:flex;gap:1.2rem;color:var(--muted);font-size:.85rem;flex-wrap:wrap}
  .stats b{color:#fff;font-weight:700}

  /* ============ UPLOAD PANEL ============ */
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.2rem;margin-top:1.25rem}
  .panel h2{font-size:1rem;margin-bottom:.85rem;display:flex;align-items:center;gap:.5rem}
  .panel h2 i{color:var(--accent)}
  .upload-row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
  .file-btn{
    display:inline-flex;align-items:center;gap:.5rem;padding:.55rem .9rem;border-radius:40px;
    background:var(--surface-2);border:1px dashed var(--border);font-size:.85rem;font-weight:600;cursor:pointer;
  }
  .file-btn:hover{border-color:var(--accent)}
  .file-name{font-size:.82rem;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ============ VIDEO GRID ============ */
  .grid-title{display:flex;align-items:center;justify-content:space-between;margin:1.5rem 0 .85rem;gap:.5rem}
  .grid-title h2{font-size:1.15rem}
  .video-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.1rem}
  .video-card{
    background:var(--surface);border-radius:var(--radius);overflow:hidden;
    border:1px solid var(--border);transition:.18s ease;cursor:pointer;display:flex;flex-direction:column;
  }
  .video-card:hover{transform:translateY(-3px);border-color:#3b4a5e;box-shadow:0 18px 30px -14px #000}
  .thumb{aspect-ratio:16/9;background:#0c0e12;display:flex;align-items:center;justify-content:center;position:relative;color:#4b5a6e;font-size:2rem;overflow:hidden}
  .thumb img,.thumb video{width:100%;height:100%;object-fit:cover}
  .thumb .play-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;
  }
  .video-card:hover .play-overlay{opacity:1}
  .thumb .play-overlay i{font-size:2.4rem;color:#fff}
  .card-body{padding:.85rem .9rem 1rem;display:flex;flex-direction:column;flex:1}
  .card-title{font-weight:600;font-size:.95rem;margin-bottom:.25rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .card-sub{color:var(--muted);font-size:.78rem;margin-bottom:.55rem}
  .card-actions{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;margin-top:auto}
  .act-btn{
    display:inline-flex;align-items:center;gap:.3rem;padding:.32rem .6rem;border-radius:30px;
    font-size:.78rem;color:var(--muted);background:var(--surface-2);transition:.12s;
  }
  .act-btn:hover{color:#fff;background:#2a303c}
  .act-btn.liked{color:var(--accent)}
  .act-btn.liked i{color:var(--accent)}

  /* ============ COMMENTS IN CARD ============ */
  .comments{margin-top:.7rem;border-top:1px solid var(--border);padding-top:.7rem;display:none}
  .comments.open{display:block}
  .comment-form{display:flex;gap:.4rem;margin-bottom:.55rem}
  .comment-form input{
    flex:1;min-width:0;background:var(--bg);border:1px solid var(--border);
    border-radius:30px;padding:.45rem .8rem;outline:none;font-size:.82rem;
  }
  .comment-form input:focus{border-color:var(--accent-2)}
  .comment-form button{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;flex-shrink:0}
  .comment-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:.35rem}
  .comment-item{background:var(--bg);padding:.45rem .7rem;border-radius:10px;font-size:.8rem;border-left:2px solid var(--accent-2);word-break:break-word}
  .comment-item b{color:#fff;margin-right:.3rem}

  /* ============ EMPTY ============ */
  .empty{padding:2.5rem 1rem;text-align:center;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);margin-top:1rem}
  .empty i{font-size:2.4rem;margin-bottom:.6rem;color:#2d3a4e;display:block}

  /* ============ SHORT VIDEO PLAYER MODAL ============ */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.92);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    z-index:100;visibility:hidden;opacity:0;transition:.2s;
    padding:0;
  }
  .modal-bg.active{visibility:visible;opacity:1}
  .short-player{
    width:100%;max-width:460px;height:100vh;max-height:100vh;
    background:#000;position:relative;display:flex;flex-direction:column;
    overflow:hidden;
  }
  .short-player .close{
    position:absolute;top:calc(.75rem + var(--safe-t));right:.75rem;
    width:38px;height:38px;border-radius:50%;
    background:rgba(0,0,0,.6);color:#fff;
    display:flex;align-items:center;justify-content:center;z-index:5;
  }
  .short-player .close:hover{background:var(--accent)}
  .short-video-wrap{
    flex:1;min-height:0;position:relative;
    display:flex;align-items:center;justify-content:center;
    background:#000;overflow:hidden;
  }
  .short-video-wrap video{width:100%;height:100%;object-fit:contain;background:#000}
  .short-overlay{
    position:absolute;bottom:0;left:0;right:0;
    padding:1rem 1rem calc(1rem + var(--safe-b));
    background:linear-gradient(to top,rgba(0,0,0,.85),transparent);
    z-index:3;display:flex;flex-direction:column;gap:.75rem;
  }
  .short-title{font-weight:700;font-size:1rem;line-height:1.35;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);word-break:break-word}
  .short-meta{color:#cfd9e6;font-size:.8rem}
  .short-actions{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap}
  .short-actions .act-btn{background:rgba(255,255,255,.12);color:#fff;backdrop-filter:blur(6px);font-size:.82rem}
  .short-actions .act-btn:hover{background:rgba(255,255,255,.22)}
  .short-actions .act-btn.liked{color:var(--accent);background:rgba(255,59,92,.18)}
  .short-comments{
    background:var(--surface);border-radius:16px 16px 0 0;
    max-height:38vh;display:none;flex-direction:column;
    border-top:1px solid var(--border);
  }
  .short-comments.open{display:flex}
  .short-comments .comment-form{padding:.7rem .8rem;border-bottom:1px solid var(--border);margin:0}
  .short-comments .comment-list{padding:.6rem .8rem calc(.6rem + var(--safe-b));overflow-y:auto}

  /* ============ TOAST ============ */
  .toast{
    position:fixed;bottom:calc(1.25rem + var(--safe-b));left:50%;
    transform:translateX(-50%) translateY(150%);
    background:#1f242e;border:1px solid var(--border);
    padding:.7rem 1.2rem;border-radius:40px;font-size:.88rem;
    z-index:500;transition:.3s ease;box-shadow:0 15px 30px -10px #000;
    max-width:90vw;text-align:center;word-break:break-word;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}
  .toast.ok{border-color:#22c55e}
  .toast.err{border-color:var(--accent)}

  /* ============ RESPONSIVE ============ */
  @media (max-width:1100px){
    .video-grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  }
  @media (max-width:900px){
    .sidebar{display:none}
    .main{padding:1rem 1rem calc(4rem + var(--safe-b))}
    .search-wrap{max-width:100%}
  }
  @media (max-width:640px){
    :root{--nav-h:58px}
    .topnav{padding:0 .5rem;gap:.4rem}
    .brand .logo-text{display:none}
    .btn span{display:none}
    .btn{padding:.5rem .7rem}
    .search-wrap input{padding:.5rem .7rem;font-size:.88rem}
    .search-wrap button{padding:.5rem .75rem}
    .profile-head{flex-direction:column;align-items:flex-start;gap:.75rem}
    .avatar-xl{width:84px;height:84px;font-size:1.9rem}
    .profile-meta h1{font-size:1.35rem}
    .video-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.75rem}
    .card-body{padding:.65rem .7rem .8rem}
    .card-title{font-size:.88rem}
    .card-sub{font-size:.72rem}
    .act-btn{font-size:.72rem;padding:.28rem .5rem}
    .short-player{max-width:100vw}
  }
  @media (max-width:400px){
    .video-grid{grid-template-columns:1fr 1fr;gap:.6rem}
  }
</style>
</head>
<body>

<!-- ================= TOP NAV ================= -->
<header class="topnav">
  <a href="#" class="brand">
    <div class="logo"><i class="fas fa-play"></i></div>
    <div class="logo-text">Free<span>Time</span></div>
  </a>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="Search videos…" autocomplete="off">
    <button id="searchBtn" title="Search"><i class="fas fa-search"></i></button>
  </div>

  <div class="nav-actions" id="navActions">
    <button class="btn btn-primary" id="navSignIn"><i class="fas fa-arrow-right-to-bracket"></i> <span>Sign in</span></button>
    <button class="btn btn-outline" id="navSignUp"><i class="fas fa-user-plus"></i> <span>Sign up</span></button>
  </div>

  <div class="nav-actions hidden" id="navUser">
    <button class="btn btn-outline" id="navUploadTop"><i class="fas fa-cloud-upload-alt"></i> <span>Upload</span></button>
    <div class="avatar" id="navAvatar" title="Profile">FT</div>
    <button class="btn btn-ghost" id="navSignOut" title="Sign out"><i class="fas fa-right-from-bracket"></i></button>
  </div>
</header>

<!-- ================= APP SHELL ================= -->
<div class="shell">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="side-item active" data-nav="home"><i class="fas fa-house"></i> Home</div>
    <div class="side-item" data-nav="trending"><i class="fas fa-fire"></i> Trending</div>
    <div class="side-item" data-nav="subscriptions"><i class="fas fa-users"></i> Subscriptions</div>
    <div class="side-divider"></div>
    <div class="side-item" data-nav="myvideos"><i class="fas fa-video"></i> My Videos</div>
    <div class="side-item" data-nav="liked"><i class="fas fa-heart"></i> Liked Videos</div>
    <div class="side-divider"></div>
    <div class="side-item" data-nav="about"><i class="fas fa-circle-info"></i> About</div>
  </aside>

  <!-- MAIN -->
  <main class="main" id="main">

    <!-- AUTH -->
    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tabSignIn">Sign in</button>
          <button class="auth-tab" id="tabSignUp">Sign up</button>
        </div>

        <form id="formSignIn" class="auth-form">
          <div class="field">
            <label>Email</label>
            <input type="email" id="signInEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="signInPassword" placeholder="••••••••" required minlength="6">
          </div>
          <button type="submit" class="auth-submit">Sign in</button>
          <div class="auth-msg" id="signInMsg"></div>
        </form>

        <form id="formSignUp" class="auth-form hidden">
          <div class="field">
            <label>Username</label>
            <input type="text" id="signUpUsername" placeholder="yourhandle" required minlength="3" maxlength="50">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" id="signUpEmail" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="signUpPassword" placeholder="At least 6 characters" required minlength="6">
          </div>
          <button type="submit" class="auth-submit">Create account</button>
          <div class="auth-msg" id="signUpMsg"></div>
        </form>
      </div>
    </div>

    <!-- APP -->
    <div id="appContent" class="hidden">

      <div id="profileHead">
        <div class="profile-banner"></div>
        <div class="profile-head">
          <div class="avatar-xl" id="profileAvatar">FT</div>
          <div class="profile-meta">
            <h1 id="profileName">Your Channel</h1>
            <div class="username" id="profileUsername">@yourhandle</div>
            <div class="stats">
              <div><b id="statVideos">0</b> videos</div>
              <div><b id="statViews">0</b> views</div>
              <div><b id="statFollowers">0</b> followers</div>
              <div><b id="statLikes">0</b> likes</div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel" id="uploadPanel">
        <h2><i class="fas fa-cloud-upload-alt"></i> Upload a new video</h2>
        <div class="field">
          <label>Title</label>
          <input type="text" id="uploadTitle" placeholder="Give your video a title…" maxlength="200">
        </div>
        <div class="field">
          <label>Description (optional)</label>
          <textarea id="uploadDesc" rows="2" placeholder="Tell viewers about your video…" maxlength="2000"></textarea>
        </div>
        <div class="upload-row">
          <label class="file-btn" for="videoFile"><i class="fas fa-folder-open"></i> Choose video</label>
          <input type="file" id="videoFile" accept="video/*" class="hidden">
          <span class="file-name" id="fileName">No file selected</span>
          <button class="btn btn-primary" id="uploadBtn"><i class="fas fa-arrow-up"></i> Upload</button>
        </div>
      </div>

      <div class="grid-title">
        <h2 id="feedTitle">My Videos</h2>
        <span class="muted" id="feedCount">0 videos</span>
      </div>
      <div class="video-grid" id="videoGrid"></div>
      <div class="empty" id="emptyFeed">
        <i class="fas fa-video"></i>
        <p>No videos yet. Upload your first video to get started!</p>
      </div>

    </div>
  </main>
</div>

<!-- ================= SHORT VIDEO PLAYER MODAL ================= -->
<div class="modal-bg" id="playerModal">
  <div class="short-player">
    <button class="close" id="playerClose"><i class="fas fa-times"></i></button>

    <div class="short-video-wrap">
      <video id="playerVideo" controls playsinline preload="metadata"></video>
      <div class="short-overlay">
        <div class="short-title" id="playerTitle">Video title</div>
        <div class="short-meta" id="playerMeta"></div>
        <div class="short-actions" id="playerActions"></div>
      </div>
    </div>

    <div class="short-comments" id="playerComments">
      <div class="comment-form">
        <input type="text" id="playerCommentInput" placeholder="Add a comment…">
        <button id="playerCommentSend"><i class="fas fa-paper-plane"></i></button>
      </div>
      <div class="comment-list" id="playerCommentList"></div>
    </div>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast"></div>

<!-- ================= APP SCRIPT ================= -->
<script>
/* ============================================================
   FREETIME APP · Supabase backend
   ============================================================ */
const SUPABASE_URL = 'https://riyotfeepgscpjalnekz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_K0aOpQUQmpiEDQHM1IcEFQ_40EfInwV';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------- STATE ---------------- */
const state = { user: null, profile: null, videos: [], view: 'home', search: '' };

/* ---------------- DOM ---------------- */
const $  = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

const authScreen   = $('#authScreen');
const appContent   = $('#appContent');
const navActions   = $('#navActions');
const navUser      = $('#navUser');
const navAvatar    = $('#navAvatar');
const videoGrid    = $('#videoGrid');
const emptyFeed    = $('#emptyFeed');
const feedTitle    = $('#feedTitle');
const feedCount    = $('#feedCount');
const toastEl      = $('#toast');

/* ---------------- HELPERS ---------------- */
function toast(msg, type = 'ok') {
  toastEl.textContent = msg;
  toastEl.className = 'toast show ' + (type === 'err' ? 'err' : 'ok');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.className = 'toast', 2600);
}
function esc(s = '') { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
  return n.toString();
}
function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString();
}
function initials(name = 'FT') {
  return name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase() || 'FT';
}

/* ---------------- AUTH UI ---------------- */
$('#navSignIn').onclick = () => showAuth('signin');
$('#navSignUp').onclick = () => showAuth('signup');
$('#navUploadTop').onclick = () => {
  if (!state.user) return showAuth('signin');
  $('#uploadPanel').scrollIntoView({ behavior: 'smooth' });
};
$('#navSignOut').onclick = async () => { await sb.auth.signOut(); toast('Signed out'); };

function showAuth(tab) {
  authScreen.classList.remove('hidden');
  appContent.classList.add('hidden');
  switchTab(tab);
}
function switchTab(tab) {
  const isSignIn = tab === 'signin';
  $('#tabSignIn').classList.toggle('active', isSignIn);
  $('#tabSignUp').classList.toggle('active', !isSignIn);
  $('#formSignIn').classList.toggle('hidden', !isSignIn);
  $('#formSignUp').classList.toggle('hidden', isSignIn);
}
$('#tabSignIn').onclick = () => switchTab('signin');
$('#tabSignUp').onclick = () => switchTab('signup');

/* ---------------- SIGN UP ---------------- */
$('#formSignUp').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = $('#signUpEmail').value.trim();
  const password = $('#signUpPassword').value;
  const username = $('#signUpUsername').value.trim().toLowerCase();
  const msg      = $('#signUpMsg');
  msg.className  = 'auth-msg';
  msg.textContent = 'Creating account…';

  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: { data: { username } }
  });

  if (error) {
    msg.className = 'auth-msg error';
    msg.textContent = error.message;
    return;
  }

  msg.className = 'auth-msg ok';
  msg.textContent = 'Account created! You are now signed in.';
});

/* ---------------- SIGN IN ---------------- */
$('#formSignIn').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email    = $('#signInEmail').value.trim();
  const password = $('#signInPassword').value;
  const msg      = $('#signInMsg');
  msg.className  = 'auth-msg';
  msg.textContent = 'Signing in…';

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.className = 'auth-msg error'; msg.textContent = error.message; return; }
  msg.className = 'auth-msg ok';
  msg.textContent = 'Welcome back!';
});

/* ---------------- SESSION ---------------- */
sb.auth.onAuthStateChange(async (event, session) => {
  if (session?.user) {
    state.user = session.user;
    await loadProfile();
    await enterApp();
  } else {
    state.user = null;
    state.profile = null;
    state.videos = [];
    exitApp();
  }
});

async function loadProfile() {
  const { data, error } = await sb
    .from('profiles')
    .select('*')
    .eq('id', state.user.id)
    .maybeSingle();

  if (error) { console.error('profile load', error); return; }

  if (!data) {
    const meta = state.user.user_metadata || {};
    const username = (meta.username || state.user.email.split('@')[0] || 'user').toLowerCase();
    const { data: created } = await sb.from('profiles').insert({
      id: state.user.id,
      username,
      email: state.user.email,
      full_name: username,
    }).select().maybeSingle();
    state.profile = created;
  } else {
    state.profile = data;
  }
}

async function enterApp() {
  authScreen.classList.add('hidden');
  appContent.classList.remove('hidden');
  navActions.classList.add('hidden');
  navUser.classList.remove('hidden');

  const p = state.profile || {};
  const name = p.full_name || p.username || 'Your Channel';
  $('#profileName').textContent = name;
  $('#profileUsername').textContent = '@' + (p.username || 'user');
  $('#profileAvatar').textContent = initials(name);
  navAvatar.textContent = initials(name);

  await loadVideos();
  renderProfileStats();
}

function exitApp() {
  authScreen.classList.remove('hidden');
  appContent.classList.add('hidden');
  navActions.classList.remove('hidden');
  navUser.classList.add('hidden');
  state.videos = [];
}

/* ---------------- VIDEO LOADING ---------------- */
async function loadVideos() {
  if (!state.user) return;

  let query = sb.from('videos').select('*').order('created_at', { ascending: false });

  if (state.view === 'myvideos' || state.view === 'profile') {
    query = query.eq('user_id', state.user.id);
  }
  if (state.view === 'liked') {
    const { data: likes } = await sb.from('video_likes').select('video_id').eq('user_id', state.user.id);
    const ids = (likes || []).map(l => l.video_id);
    if (!ids.length) { state.videos = []; renderVideos(); renderProfileStats(); return; }
    query = query.in('id', ids);
  }
  if (state.search) query = query.ilike('title', `%${state.search}%`);

  const { data, error } = await query.limit(60);
  if (error) { console.error(error); toast('Could not load videos', 'err'); return; }

  state.videos = data || [];
  renderVideos();
  renderProfileStats();
}

/* ---------------- RENDER GRID ---------------- */
function renderVideos() {
  const vids = state.videos;

  feedTitle.textContent =
    state.view === 'liked'         ? 'Liked Videos' :
    state.view === 'trending'      ? 'Trending' :
    state.view === 'subscriptions' ? 'Subscriptions' :
    state.view === 'home'          ? 'Home' :
    'My Videos';
  feedCount.textContent = `${vids.length} video${vids.length === 1 ? '' : 's'}`;

  if (!vids.length) {
    videoGrid.innerHTML = '';
    emptyFeed.classList.remove('hidden');
    return;
  }
  emptyFeed.classList.add('hidden');

  videoGrid.innerHTML = vids.map(v => {
    const liked = v.__liked === true;
    return `
      <div class="video-card" data-id="${v.id}">
        <div class="thumb">
          ${v.thumbnail_url ? `<img src="${esc(v.thumbnail_url)}" alt="">` : `<i class="fas fa-play-circle"></i>`}
          <div class="play-overlay"><i class="fas fa-play"></i></div>
        </div>
        <div class="card-body">
          <div class="card-title">${esc(v.title)}</div>
          <div class="card-sub">${fmtNum(v.view_count)} views · ${fmtDate(v.created_at)}</div>
          <div class="card-actions">
            <button class="act-btn like-btn ${liked ? 'liked' : ''}" data-id="${v.id}">
              <i class="${liked ? 'fas' : 'far'} fa-heart"></i> <span>${fmtNum(v.like_count)}</span>
            </button>
            <button class="act-btn comment-btn" data-id="${v.id}">
              <i class="far fa-comment"></i> <span>${fmtNum(v.comment_count)}</span>
            </button>
            <button class="act-btn share-btn" data-id="${v.id}">
              <i class="fas fa-share-alt"></i>
            </button>
          </div>
          <div class="comments" data-comments="${v.id}">
            <div class="comment-form">
              <input type="text" placeholder="Add a comment…" data-comment-input="${v.id}">
              <button data-comment-send="${v.id}"><i class="fas fa-paper-plane"></i></button>
            </div>
            <div class="comment-list" data-comment-list="${v.id}"></div>
          </div>
        </div>
      </div>`;
  }).join('');

  $$('.video-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('button, input')) return;
      openPlayer(card.dataset.id);
    });
  });
  $$('.like-btn').forEach(b => b.onclick = (e) => { e.stopPropagation(); toggleLike(b.dataset.id); });
  $$('.comment-btn').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const box = document.querySelector(`[data-comments="${b.dataset.id}"]`);
    box.classList.toggle('open');
    if (box.classList.contains('open')) loadComments(b.dataset.id);
  });
  $$('.share-btn').forEach(b => b.onclick = (e) => {
    e.stopPropagation();
    const url = `${location.origin}${location.pathname}?v=${b.dataset.id}`;
    if (navigator.share) {
      navigator.share({ title: 'FreeTime video', url }).catch(() => {});
    } else {
      navigator.clipboard?.writeText(url).then(() => toast('Link copied!'), () => toast('Share: ' + url));
    }
  });
  $$('[data-comment-send]').forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      submitComment(btn.dataset.commentSend, `[data-comment-input="${btn.dataset.commentSend}"]`);
    };
  });
  $$('[data-comment-input]').forEach(inp => {
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitComment(inp.dataset.commentInput, inp); }
    });
  });
}

function renderProfileStats() {
  const vids = state.videos;
  const totalViews = vids.reduce((s, v) => s + (v.view_count || 0), 0);
  const totalLikes = vids.reduce((s, v) => s + (v.like_count || 0), 0);
  $('#statVideos').textContent    = vids.length;
  $('#statViews').textContent     = fmtNum(totalViews);
  $('#statLikes').textContent     = fmtNum(totalLikes);
  $('#statFollowers').textContent = fmtNum(state.profile?.follower_count || 0);
}

/* ---------------- LIKE ---------------- */
async function toggleLike(videoId) {
  if (!state.user) return;
  const already = await sb.from('video_likes')
    .select('video_id', { count: 'exact', head: true })
    .eq('user_id', state.user.id).eq('video_id', videoId);
  const isLiked = (already.count || 0) > 0;

  if (isLiked) {
    await sb.from('video_likes').delete().eq('user_id', state.user.id).eq('video_id', videoId);
  } else {
    await sb.from('video_likes').insert({ user_id: state.user.id, video_id: videoId });
  }

  const { data } = await sb.from('videos').select('*').eq('id', videoId).maybeSingle();
  if (data) {
    data.__liked = !isLiked;
    const idx = state.videos.findIndex(v => v.id === videoId);
    if (idx > -1) state.videos[idx] = data;
  }
  renderVideos();
}

/* ---------------- COMMENTS ---------------- */
async function loadComments(videoId) {
  const listEl = document.querySelector(`[data-comment-list="${videoId}"]`);
  if (!listEl) return;
  const { data, error } = await sb.from('comments')
    .select('*, profiles:user_id(username, full_name)')
    .eq('video_id', videoId)
    .order('created_at', { ascending: true });
  if (error) { console.error(error); return; }
  listEl.innerHTML = (data || []).map(c => {
    const name = c.profiles?.full_name || c.profiles?.username || 'User';
    return `<div class="comment-item"><b>${esc(name)}</b>${esc(c.content)}</div>`;
  }).join('') || `<div class="muted" style="font-size:.8rem">No comments yet.</div>`;
}

async function submitComment(videoId, input) {
  const el = typeof input === 'string' ? document.querySelector(input) : input;
  const text = el?.value?.trim();
  if (!text || !state.user) return;
  const { error } = await sb.from('comments').insert({
    video_id: videoId,
    user_id: state.user.id,
    content: text,
  });
  if (error) { toast(error.message, 'err'); return; }
  el.value = '';
  await loadComments(videoId);
  const v = state.videos.find(x => x.id === videoId);
  if (v) v.comment_count = (v.comment_count || 0) + 1;
  renderVideos();
}

/* ---------------- UPLOAD ---------------- */
$('#videoFile').addEventListener('change', (e) => {
  const f = e.target.files[0];
  $('#fileName').textContent = f ? f.name : 'No file selected';
});

$('#uploadBtn').addEventListener('click', async () => {
  if (!state.user) return showAuth('signin');
  const file  = $('#videoFile').files[0];
  const title = $('#uploadTitle').value.trim();
  const desc  = $('#uploadDesc').value.trim();

  if (!file)  { toast('Please choose a video file', 'err'); return; }
  if (!title) { toast('Please enter a title', 'err'); return; }

  const btn = $('#uploadBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading…';

  try {
    const ext  = file.name.split('.').pop();
    const path = `${state.user.id}/${Date.now()}.${ext}`;
    const { error: upErr } = await sb.storage.from('videos').upload(path, file, { upsert: false });
    if (upErr) throw upErr;

    const { data: urlData } = sb.storage.from('videos').getPublicUrl(path);

    const { error: dbErr } = await sb.from('videos').insert({
      user_id: state.user.id,
      title,
      description: desc || null,
      video_url: urlData.publicUrl,
      visibility: 'public',
    });
    if (dbErr) throw dbErr;

    toast('Video uploaded!');
    $('#videoFile').value = '';
    $('#uploadTitle').value = '';
    $('#uploadDesc').value = '';
    $('#fileName').textContent = 'No file selected';

    await loadVideos();
  } catch (err) {
    console.error(err);
    toast(err.message || 'Upload failed', 'err');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-arrow-up"></i> Upload';
  }
});

/* ---------------- SHORT PLAYER ---------------- */
const playerModal  = $('#playerModal');
const playerVideo  = $('#playerVideo');
const playerTitle  = $('#playerTitle');
const playerMeta   = $('#playerMeta');
const playerActions = $('#playerActions');
const playerComments = $('#playerComments');
const playerCommentList = $('#playerCommentList');
const playerCommentInput = $('#playerCommentInput');

let currentPlayerId = null;

async function openPlayer(videoId) {
  const v = state.videos.find(x => x.id === videoId);
  if (!v) return;
  currentPlayerId = videoId;

  playerTitle.textContent = v.title;
  playerMeta.textContent  = `${fmtNum(v.view_count)} views · ${fmtDate(v.created_at)}`;
  playerVideo.src = v.video_url;
  playerVideo.load();

  playerActions.innerHTML = `
    <button class="act-btn" id="playerLikeBtn"><i class="far fa-heart"></i> Like</button>
    <button class="act-btn" id="playerCommentBtn"><i class="far fa-comment"></i> Comments</button>
    <button class="act-btn" id="playerShareBtn"><i class="fas fa-share-alt"></i> Share</button>
  `;
  $('#playerLikeBtn').onclick = () => toggleLike(videoId);
  $('#playerCommentBtn').onclick = () => playerComments.classList.toggle('open');
  $('#playerShareBtn').onclick = () => {
    const url = `${location.origin}${location.pathname}?v=${videoId}`;
    if (navigator.share) navigator.share({ title: v.title, url }).catch(() => {});
    else navigator.clipboard?.writeText(url).then(() => toast('Link copied!'));
  };

  await loadComments(videoId);
  playerCommentList.innerHTML = document.querySelector(`[data-comment-list="${videoId}"]`)?.innerHTML || '';
  playerComments.classList.remove('open');
  playerModal.classList.add('active');

  if (!sessionStorage.getItem('viewed_' + videoId)) {
    sessionStorage.setItem('viewed_' + videoId, '1');
    sb.rpc('increment_view', { vid: videoId }).catch(() => {});
  }
}

$('#playerClose').onclick = () => {
  playerModal.classList.remove('active');
  playerVideo.pause();
  playerVideo.src = '';
  currentPlayerId = null;
};

playerCommentInput.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter' || !currentPlayerId) return;
  e.preventDefault();
  const text = playerCommentInput.value.trim();
  if (!text) return;
  const { error } = await sb.from('comments').insert({
    video_id: currentPlayerId,
    user_id: state.user.id,
    content: text,
  });
  if (error) { toast(error.message, 'err'); return; }
  playerCommentInput.value = '';
  await loadComments(currentPlayerId);
  playerCommentList.innerHTML = document.querySelector(`[data-comment-list="${currentPlayerId}"]`)?.innerHTML || '';
});

$('#playerCommentSend').onclick = () => {
  const ev = new KeyboardEvent('keydown', { key: 'Enter' });
  playerCommentInput.dispatchEvent(ev);
};

/* ---------------- SIDEBAR ---------------- */
$$('.side-item').forEach(item => {
  item.onclick = () => {
    $$('.side-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    state.view = item.dataset.nav;
    state.search = '';
    $('#searchInput').value = '';
    if (!state.user) { showAuth('signin'); return; }
    loadVideos();
  };
});

/* ---------------- SEARCH ---------------- */
$('#searchBtn').onclick = () => {
  state.search = $('#searchInput').value.trim();
  if (!state.user) return showAuth('signin');
  loadVideos();
};
$('#searchInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('#searchBtn').click();
});

/* ---------------- BOOT ---------------- */
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    state.user = session.user;
    await loadProfile();
    await enterApp();
  } else {
    exitApp();
  }
})();
</script>
